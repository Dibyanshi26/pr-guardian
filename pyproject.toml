[project]
name = "pr-guardian"
version = "0.1.0"
description = "GitHub bot that catches silent failures in pull requests"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "openai>=3.19",
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guardian*"]
